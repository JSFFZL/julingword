      <!-- <button class="toggle-btn">◀</button> -->

      <!-- iframe 用来加载独立页面 -->
      <div class="content">
            <iframe id="contentIframe" src="pages/开户.html"></iframe>
      </div>

      <script>
            const menuItems = document.querySelectorAll('.menu-item');
            const iframe = document.getElementById('contentIframe');
            const sidebarWrap = document.querySelector('.sidebar-wrap');
            const toggleBtn = document.querySelector('.toggle-btn');
            const hasSubmenu = document.querySelector('.has-submenu');
            const submenu = document.getElementById('singlePlayerSubmenu');
            const arrow = document.querySelector('.arrow');
            let isCollapsed = false;

            //菜单点击，切换iframe地址
            menuItems.forEach(item => {
                  item.addEventListener('click', () => {
                        // 如果点击的是“单机版”父菜单，只展开/收起，不切换 iframe
                        if (item.classList.contains('has-submenu')) {
                              submenu.classList.toggle('open');
                              arrow.classList.toggle('rotate');
                              return;
                        }

                        // 切换 active 状态
                        menuItems.forEach(mi => mi.classList.remove('active'));
                        item.classList.add('active');

                        // 加载对应页面
                        const pagePath = item.getAttribute('data-page');
                        if (pagePath) {
                              iframe.src = pagePath;
                        }
                  });
            });

      </script>
</body>
